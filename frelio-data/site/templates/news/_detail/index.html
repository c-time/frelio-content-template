<!DOCTYPE html>
<html lang="ja">
<head>
  <template data-gen-scope="" data-gen-include="_parts/head.htm"></template>
  <title>記事タイトル | Frelio Demo</title>
  <link rel="stylesheet" href="/news/styles/index.css">
  <script type="module" src="/news/scripts/index.js"></script>
</head>
<body>
  <template data-gen-scope="" data-gen-include="_parts/header.htm"></template>

  <main class="l-main">
    <template data-gen-scope="">
      <article class="p-article">
        <div class="p-article__inner">
          <header class="p-article__header">
            <time class="p-article__date" data-gen-text="publishDate">2026-03-01</time>
            <h1 class="p-article__title" data-gen-text="title">記事タイトル</h1>
          </header>
          <!-- 【参考実例】ストレージ画像の参照
               eyecatch.url は R2 の生キー（例: 2026/<uuid>/medium.webp）。公開サイトで表示するには
               コンテンツ配信 Worker の /storage/* 配信に合わせて /storage/ を前置する必要がある。
               gentl の data-gen-attrs は「属性:データパス」形式のみで文字列結合できないため、
               レシピ(admin/recipes/build-data-recipe.json)の customField で
                 { "field": "eyecatchSrc", "source": "/storage/{$this.eyecatch.url}", "type": "string" }
               と組み立てた eyecatchSrc をバインドする（＝定数+変数の連結はデータ層で行う）。
               下の src="/images/placeholder.jpg" は data-gen 差し替え前の一瞬に出るだけの静的フォールバック。
               実画像は data-gen-attrs="src:eyecatchSrc" が R2 の画像に差し替える。コンテンツ側は画像を
               先に R2 へ登録し、eyecatch フィールドに生キーを設定すること（このプレースホルダを残さない）。 -->
          <template data-gen-scope="" data-gen-if="eyecatch">
            <div class="p-article__eyecatch">
              <img class="p-article__eyecatch__image" data-gen-attrs="src:eyecatchSrc,alt:title" src="/images/placeholder.jpg" alt="記事タイトル">
            </div>
          </template>
          <div class="p-article__body" data-gen-html="body">
            <p>これはプレビュー用のダミー本文です。実際の記事コンテンツがここに表示されます。</p>
          </div>

          <!-- 前/次の記事ナビ（レシピの navigation 設定で prev/next が解決される。端では null） -->
          <nav class="p-article__nav">
            <template data-gen-scope="" data-gen-if="prev">
              <a class="p-article__nav-prev" data-gen-attrs="href:prev.href">
                <span class="p-article__nav-label">← 前の記事</span>
                <span class="p-article__nav-title" data-gen-text="prev.title">前の記事タイトル</span>
              </a>
            </template>
            <template data-gen-scope="" data-gen-if="next">
              <a class="p-article__nav-next" data-gen-attrs="href:next.href">
                <span class="p-article__nav-label">次の記事 →</span>
                <span class="p-article__nav-title" data-gen-text="next.title">次の記事タイトル</span>
              </a>
            </template>
          </nav>

          <div class="p-article__footer">
            <a href="/news/" class="c-btn">お知らせ一覧に戻る</a>
          </div>
        </div>
      </article>
    </template>
  </main>

  <template data-gen-scope="" data-gen-include="_parts/footer.htm"></template>
</body>
</html>
