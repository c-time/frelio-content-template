<!DOCTYPE html>
<html lang="ja">
<head>
  <template data-gen-scope="" data-gen-include="_parts/head.htm"></template>
  <title>お知らせ | Frelio Demo</title>
  <link rel="stylesheet" href="/news/styles/index.css">
  <script type="module" src="/news/scripts/index.js"></script>
</head>
<body>
  <template data-gen-scope="" data-gen-include="_parts/header.htm"></template>

  <main class="l-main">
    <section class="p-news-list">
      <div class="p-news-list__inner">
        <h1 class="e-heading">お知らせ</h1>
        <ul class="p-news-list__items">
          <!-- 【参考実例】記事詳細へのリンク
               list / relationList のアイテムには href が自動付与されない（自動なのは prev/next 等のナビのみ）。
               そのためレシピ(admin/recipes/build-data-recipe.json)の list の customField で
                 { "field": "href", "source": "/news/{$this.slug}/", "type": "string" }
               と組み立てた article.href をバインドする。値は詳細レシピの outputPath
               (news/{$this.slug}/index.json → URL /news/{slug}/) と一致させること。 -->
          <template data-gen-scope="" data-gen-repeat="pagedItems" data-gen-repeat-name="article">
            <li class="p-news-list__item">
              <a class="c-card--news" data-gen-attrs="href:article.href">
                <div class="c-card__body">
                  <time class="c-card__date" data-gen-text="article.publishDate">2026-03-01</time>
                  <h3 class="c-card__title" data-gen-text="article.title">お知らせタイトル</h3>
                  <p class="c-card__excerpt" data-gen-text="article.excerpt">お知らせの概要がここに入ります。</p>
                </div>
              </a>
            </li>
            <li class="p-news-list__item" data-gen-comment="">
              <a class="c-card--news" href="/news/sample/">
                <div class="c-card__body">
                  <time class="c-card__date">2026-03-01</time>
                  <h3 class="c-card__title">サンプルお知らせ</h3>
                  <p class="c-card__excerpt">これはプレビュー用のダミーデータです。</p>
                </div>
              </a>
            </li>
          </template>
        </ul>

        <!-- 【参考実例】ページ送り（レシピの list に pagination があると自動で出力される）
             prevPage / nextPage（端では null）・pages（各 { number, href, current }）の href は
             生成側が出力パス（outputPath の {$page} / pagination.startPath）から組み立て済みなので、そのままバインドする。
             current は aria-current="true"/"false" として出力し、CSS で現在ページを強調する。 -->
        <nav class="p-news-list__pager" aria-label="ページ送り">
          <template data-gen-scope="" data-gen-if="prevPage">
            <a class="p-news-list__pager-prev" rel="prev" data-gen-attrs="href:prevPage.href">前へ</a>
          </template>
          <ol class="p-news-list__pager-pages">
            <template data-gen-scope="" data-gen-repeat="pages" data-gen-repeat-name="page">
              <li class="p-news-list__pager-item">
                <a class="p-news-list__pager-page" data-gen-attrs="href:page.href,aria-current:page.current" data-gen-text="page.number">1</a>
              </li>
            </template>
          </ol>
          <template data-gen-scope="" data-gen-if="nextPage">
            <a class="p-news-list__pager-next" rel="next" data-gen-attrs="href:nextPage.href">次へ</a>
          </template>
        </nav>
      </div>
    </section>
  </main>

  <template data-gen-scope="" data-gen-include="_parts/footer.htm"></template>
</body>
</html>
